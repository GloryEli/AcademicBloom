{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f9fd">
    <title>{% block title %}Academic Bloom{% endblock %}</title>
    
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles_preview.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="{% static 'css/study_plan.css' %}">
</head>
<body class="app-shell">
    <div class="layout-container">
        
        <aside class="sidebar" id="sidebar">
            
            {% include 'sidebar_component.html' with courses=courses current_page=current_page %}
        </aside>

        <!-- Main content area -->
        <div class="main-content" id="mainContent">
            {% block content %}{% endblock %}
        </div>

        <button class="toggle-sidebar" id="toggleSidebar">❯</button>
    </div>
    <script src="{% static 'js/sidebar.js' %}"></script>
</body>
</html>
