{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Advice</title>
    <link rel="stylesheet" href="{% static 'css/guidance.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <main class="app-guidance">
        <p class="hero-eyebrow">YOUR LEARNING JOURNEY</p>
        <h1>Your study guidance</h1>
        <p>A focused plan for {{ subject.subject_name }}.</p>

        {% if course.study_guide %}
            <div class="guidance-content">{{ course.study_guide|safe }}</div>
        {% elif error %}
            <p class="text-danger">{{ error }}</p>
        {% endif %}

        <a href="{% url 'subject_dashboard' course.id %}" class="btn">Back to course</a>
        <a href="{% url 'hero' %}" class="btn">Learning home</a>
    </main>

</body>
</html>
